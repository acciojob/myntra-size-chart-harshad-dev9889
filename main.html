
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Chart</title>

    <style>
        table {
            border-collapse: collapse;
            width: 700px;
            margin: 30px auto;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #999;
            padding: 12px;
            text-align: center;
        }

        thead {
            background-color: #f2f2f2;
        }

        th {
            font-weight: bold;
        }

        tbody tr:nth-child(even) {
            background-color: #fafafa;
        }
    </style>
</head>

<body>

    <table>

        <thead>
            <tr>
                <th>Size</th>
                <th>Chest (in)</th>
                <th>Length (in)</th>
                <th>Shoulder (in)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>S</td>
                <td>38</td>
                <td>27</td>
                <td>17</td>
            </tr>

            <tr>
                <td>M</td>
                <td>40</td>
                <td>28</td>
                <td>18</td>
            </tr>

            <tr>
                <td>L</td>
                <td>42</td>
                <td>29</td>
                <td>19</td>
            </tr>

            <tr>
                <td>XL</td>
                <td>44</td>
                <td>30</td>
                <td>20</td>
            </tr>

            <tr>
                <td>XXL</td>
                <td>46</td>
                <td>31</td>
                <td>21</td>
            </tr>
        </tbody>

    </table>

</body>
</html>
